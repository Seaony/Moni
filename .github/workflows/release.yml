name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-26
    env:
      APPLE_TEAM_ID: G34NXJXW94
      APP_NAME: Moni
      PROJECT: Moni.xcodeproj
      SCHEME: Moni
      DEVELOPER_ID_APPLICATION_P12: ${{ secrets.DEVELOPER_ID_APPLICATION_P12 }}
      DEVELOPER_ID_APPLICATION_PASSWORD: ${{ secrets.DEVELOPER_ID_APPLICATION_PASSWORD }}
      KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
      APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
      SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
      SPARKLE_PUBLIC_ED_KEY: ${{ vars.SPARKLE_PUBLIC_ED_KEY }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.6.app

      - name: Validate release configuration
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tags must use vMAJOR.MINOR.PATCH." >&2
            exit 1
          fi

          required=(
            DEVELOPER_ID_APPLICATION_P12
            DEVELOPER_ID_APPLICATION_PASSWORD
            KEYCHAIN_PASSWORD
            APPLE_API_KEY_P8
            APPLE_API_KEY_ID
            APPLE_API_ISSUER_ID
            SPARKLE_PRIVATE_KEY
            SPARKLE_PUBLIC_ED_KEY
          )
          for name in "${required[@]}"; do
            if [[ -z "${!name:-}" ]]; then
              echo "Required release credential is missing: $name" >&2
              exit 1
            fi
          done

          key_length="$(printf '%s' "$SPARKLE_PUBLIC_ED_KEY" | base64 --decode | wc -c | tr -d ' ')"
          if [[ "$key_length" != "32" ]]; then
            echo "SPARKLE_PUBLIC_ED_KEY must decode to a 32-byte Ed25519 public key." >&2
            exit 1
          fi

          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "BUILD_NUMBER=$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"
          echo "DERIVED_DATA=$RUNNER_TEMP/DerivedData" >> "$GITHUB_ENV"
          echo "ARCHIVE_PATH=$RUNNER_TEMP/Moni.xcarchive" >> "$GITHUB_ENV"
          echo "EXPORT_PATH=$RUNNER_TEMP/export" >> "$GITHUB_ENV"
          echo "ARTIFACTS_PATH=$RUNNER_TEMP/artifacts" >> "$GITHUB_ENV"
          echo "KEYCHAIN_PATH=$RUNNER_TEMP/release-signing.keychain-db" >> "$GITHUB_ENV"
          echo "API_KEY_PATH=$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8" >> "$GITHUB_ENV"

      - name: Install Developer ID certificate
        run: |
          set -euo pipefail
          certificate_path="$RUNNER_TEMP/developer-id.p12"
          printf '%s' "$DEVELOPER_ID_APPLICATION_P12" | base64 --decode > "$certificate_path"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$certificate_path" \
            -P "$DEVELOPER_ID_APPLICATION_PASSWORD" \
            -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -k "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"
          printf '%s' "$APPLE_API_KEY_P8" > "$API_KEY_PATH"

      - name: Archive Developer ID build
        run: |
          set -euo pipefail
          xcodebuild archive \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -archivePath "$ARCHIVE_PATH" \
            -derivedDataPath "$DERIVED_DATA" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Developer ID Application" \
            OTHER_CODE_SIGN_FLAGS="--timestamp" \
            MARKETING_VERSION="$VERSION" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            SPARKLE_PUBLIC_ED_KEY="$SPARKLE_PUBLIC_ED_KEY" \
            ARCHS="arm64 x86_64" \
            ONLY_ACTIVE_ARCH=NO

      - name: Export signed application
        run: |
          set -euo pipefail
          xcodebuild -exportArchive \
            -archivePath "$ARCHIVE_PATH" \
            -exportPath "$EXPORT_PATH" \
            -exportOptionsPlist Config/ExportOptions.plist
          scripts/validate-release.sh "$EXPORT_PATH/$APP_NAME.app"
          lipo -info "$EXPORT_PATH/$APP_NAME.app/Contents/MacOS/$APP_NAME"

      - name: Notarize and staple application
        run: |
          set -euo pipefail
          notarization_zip="$RUNNER_TEMP/notarization.zip"
          ditto -c -k --keepParent "$EXPORT_PATH/$APP_NAME.app" "$notarization_zip"
          xcrun notarytool submit "$notarization_zip" \
            --key "$API_KEY_PATH" \
            --key-id "$APPLE_API_KEY_ID" \
            --issuer "$APPLE_API_ISSUER_ID" \
            --wait
          xcrun stapler staple "$EXPORT_PATH/$APP_NAME.app"
          xcrun stapler validate "$EXPORT_PATH/$APP_NAME.app"
          spctl --assess --type execute --verbose=2 "$EXPORT_PATH/$APP_NAME.app"

      - name: Package ZIP and DMG
        run: |
          set -euo pipefail
          mkdir -p "$ARTIFACTS_PATH" "$RUNNER_TEMP/dmg-root"
          ditto -c -k --sequesterRsrc --keepParent \
            "$EXPORT_PATH/$APP_NAME.app" \
            "$ARTIFACTS_PATH/$APP_NAME-$VERSION.zip"
          ditto "$EXPORT_PATH/$APP_NAME.app" "$RUNNER_TEMP/dmg-root/$APP_NAME.app"
          ln -s /Applications "$RUNNER_TEMP/dmg-root/Applications"
          hdiutil create \
            -volname "$APP_NAME" \
            -srcfolder "$RUNNER_TEMP/dmg-root" \
            -ov -format UDZO \
            "$ARTIFACTS_PATH/$APP_NAME-$VERSION.dmg"
          codesign --force --sign "Developer ID Application" --timestamp \
            "$ARTIFACTS_PATH/$APP_NAME-$VERSION.dmg"

      - name: Notarize and staple disk image
        run: |
          set -euo pipefail
          dmg="$ARTIFACTS_PATH/$APP_NAME-$VERSION.dmg"
          xcrun notarytool submit "$dmg" \
            --key "$API_KEY_PATH" \
            --key-id "$APPLE_API_KEY_ID" \
            --issuer "$APPLE_API_ISSUER_ID" \
            --wait
          xcrun stapler staple "$dmg"
          xcrun stapler validate "$dmg"
          spctl --assess --type open --context context:primary-signature --verbose=2 "$dmg"

      - name: Generate signed Sparkle appcast
        run: |
          set -euo pipefail
          updates_path="$RUNNER_TEMP/updates"
          mkdir -p "$updates_path"
          cp "$ARTIFACTS_PATH/$APP_NAME-$VERSION.zip" "$updates_path/"
          scripts/release-notes.sh "$GITHUB_REF_NAME" > "$updates_path/$APP_NAME-$VERSION.md"
          generate_appcast="$DERIVED_DATA/SourcePackages/artifacts/sparkle/Sparkle/bin/generate_appcast"
          if [[ ! -x "$generate_appcast" ]]; then
            echo "Sparkle generate_appcast tool was not found." >&2
            exit 1
          fi
          printf '%s' "$SPARKLE_PRIVATE_KEY" | "$generate_appcast" \
            --ed-key-file - \
            --download-url-prefix "https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/" \
            --link "https://github.com/$GITHUB_REPOSITORY" \
            --embed-release-notes \
            --maximum-versions 1 \
            --maximum-deltas 0 \
            -o appcast.xml \
            "$updates_path"
          cp "$updates_path/appcast.xml" "$ARTIFACTS_PATH/appcast.xml"
          scripts/validate-release.sh \
            "$EXPORT_PATH/$APP_NAME.app" \
            "$ARTIFACTS_PATH/appcast.xml"

      - name: Publish GitHub release
        run: |
          set -euo pipefail
          assets=(
            "$ARTIFACTS_PATH/$APP_NAME-$VERSION.zip"
            "$ARTIFACTS_PATH/$APP_NAME-$VERSION.dmg"
            "$ARTIFACTS_PATH/appcast.xml"
          )
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${assets[@]}" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "${assets[@]}" \
              --verify-tag \
              --generate-notes \
              --title "$APP_NAME $VERSION"
          fi

      - name: Clean up signing material
        if: always()
        run: |
          keychain_path="${KEYCHAIN_PATH:-$RUNNER_TEMP/release-signing.keychain-db}"
          api_key_path="${API_KEY_PATH:-$RUNNER_TEMP/notary-api-key.p8}"
          security delete-keychain "$keychain_path" 2>/dev/null || true
          rm -f "$api_key_path" "$RUNNER_TEMP/developer-id.p12"
